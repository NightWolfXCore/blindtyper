<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профиль — BlindTyper</title>
  <link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
  <style>
    body { background-color: #0f172a; color: #e2e8f0; }
    .card { background-color: #1e293b; border-color: #334155; color: #fff; }
    .text-muted { color: #e2e8f0 !important; }
  </style>
</head>
<body class="p-4">
  <main class="container" style="max-width: 800px;">
    <nav class="mb-4 d-flex justify-content-between align-items-center">
      <h1 class="h3 text-light m-0">Мой профиль</h1>
      <div>
        <a href="/" class="btn btn-outline-primary me-2">К тренажеру</a>
        <a href="/leaderboard" class="btn btn-outline-light">Рейтинг</a>
      </div>
    </nav>

    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body text-center">
            <h5 class="card-title" id="user-name">Загрузка...</h5>
            <p class="text-muted mb-2" id="user-level">Уровень 1</p>
            <div class="progress" style="height: 10px;">
              <div class="progress-bar bg-success" id="xp-progress" style="width: 0%;"></div>
            </div>
            <small class="text-muted mt-2 d-block" id="xp-text">0 / 100 XP</small>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body text-center">
             <h6 class="text-muted">Лучшая скорость</h6>
             <h2 class="text-primary mb-0" id="stat-cpm">0 CPM</h2>
          </div>
        </div>
      </div>
    </div>

    <h3 class="h5 text-light mb-3">Достижения</h3>
    <div class="row g-3" id="achievements-container">
      <!-- Сюда JS вставит карточки достижений -->
    </div>
  </main>

  <script type="module" src="/assets/js/pages/profile.js"></script>
</body>
</html>
