# Include inside an HTTPS server block configured for your domain/certificate.
# APP_URL must use the same HTTPS origin. Configure HTTP -> HTTPS redirect separately.
root /srv/blindtyper/public;
index index.php;
client_max_body_size 3m;

# Only publish frontend assets; dotfiles and PHP inside assets stay private.
location ~ /\. { deny all; }
location ~* ^/assets/.*\.php(?:/|$) { deny all; }
location /assets/ { try_files $uri =404; }
location / { rewrite ^ /index.php last; }
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
location ~ \.php(?:/|$) { return 404; }
